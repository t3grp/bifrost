name: PR Tests (Requires Approval)

# Paid/provider-backed tests are deliberate operations. Routine PR and nightly
# verification lives in basic-ci.yml and never receives these credentials.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      run-vllm-tests:
        description: "Provision billable RunPod GPU tests (requires both image digests)"
        required: false
        type: boolean
        default: false
      vllm-image:
        description: "Standard vLLM image pinned as repository@sha256:digest"
        required: false
        type: string
        default: ""
      vllm-reasoning-image:
        description: "Reasoning vLLM image pinned as repository@sha256:digest"
        required: false
        type: string
        default: ""

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release')) }}
    name: Run Tests (Awaiting Approval)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: pr-testing
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            iojs.org:443
            nodejs.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Build and run unit preflight
        run: ./.github/workflows/scripts/run-tests.sh

  # Actual live-provider/SDK tests have their own pr-testing environment in the
  # reusable workflow. No publishing credentials are inherited from this caller.
  full-tests:
    needs: [run-tests]
    uses: ./.github/workflows/full-test-suite.yml
    with:
      run-vllm-tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run-vllm-tests }}
      vllm-image: ${{ inputs.vllm-image || '' }}
      vllm-reasoning-image: ${{ inputs.vllm-reasoning-image || '' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ARN: ${{ secrets.AWS_ARN }}
      AWS_BEDROCK_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
      AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      BEDROCK_GUARDRAIL_IDENTIFIER: ${{ secrets.BEDROCK_GUARDRAIL_IDENTIFIER }}
      BIFROST_ENCRYPTION_KEY: ${{ secrets.BIFROST_ENCRYPTION_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_COPILOT_APP_ID: ${{ secrets.GITHUB_COPILOT_APP_ID }}
      GITHUB_COPILOT_INSTALLATION_ID: ${{ secrets.GITHUB_COPILOT_INSTALLATION_ID }}
      GITHUB_COPILOT_PRIVATE_KEY: ${{ secrets.GITHUB_COPILOT_PRIVATE_KEY }}
      GITHUB_COPILOT_REPOSITORY_ID: ${{ secrets.GITHUB_COPILOT_REPOSITORY_ID }}
      GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
      MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
      MAXIM_LOG_REPO_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_REASONING_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_REASONING_NETWORK_VOLUME_ID }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
      VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
      VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
      VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

  # The governance E2E directory is a Go module. It needs a disposable gateway,
  # not Python dependencies or an already-running instance on a developer's VM.
  test-governance:
    needs: [run-tests, full-tests]
    if: ${{ !cancelled() && needs.run-tests.result == 'success' && needs.full-tests.outputs.build-gateway-result == 'success' }}
    name: Governance E2E (live providers)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pr-testing
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            api.openai.com:443
            getbifrost.ai:443
            github.com:443
            objects.githubusercontent.com:443
            openrouter.ai:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            www.getbifrost.ai:443

      - name: Checkout reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Download this run's gateway binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bifrost-http-binary
          path: tmp

      - name: Run isolated Go governance tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x tmp/bifrost-http
          ./.github/workflows/scripts/test-governance.sh
