name: Release Pipeline

# Triggers automatically on push to main when any version file changes
on:
  push:
    branches: ["main", "v2.0.0"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip all tests and jump directly to release (admin only)"
        required: false
        type: boolean
        default: false

# Prevent concurrent runs
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Check if pipeline should be skipped based on first line of commit message
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
      skip-core-test: ${{ steps.check.outputs.skip-core-test }}
      skip-tests: ${{ steps.skip_tests.outputs.skip-tests }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >+
            api.github.com:443

      - name: Check if pipeline should be skipped
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # head_commit is only populated on push. On workflow_dispatch this is
          # empty, so both flags read false there - the dispatch equivalent is the
          # admin-gated skip_tests input below.
          FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n 1)
          if [[ "$FIRST_LINE" == *"--skip-ci"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

          # --skip-core-test drops the two jobs that make live calls to every
          # upstream provider: test-core (the ~90 minute provider harness) and
          # test-core-integrations (the core module's live provider suite). Every
          # other test job still runs, including test-core-unit, so the release is
          # still gated on the whole suite minus the jobs that depend on eight
          # third-party APIs being healthy at that moment.
          #
          # Skipping them does not cascade: every downstream release job already
          # accepts `needs.<job>.result == 'skipped'` alongside 'success' (the
          # same path a bifrost-http-only release takes when test-core never runs).
          #
          # Distinct from --skip-ci, which skips the entire pipeline including the
          # release, and from skip_tests, which drops every test job and is admin-only.
          # This one is deliberately NOT permission-gated: it still ships a release
          # whose unit, integration, migration, docker and API-integration coverage all
          # passed. Use it when a provider outage is blocking a release that has
          # nothing to do with that provider - not to get a red harness out the door.
          if [[ "$FIRST_LINE" == *"--skip-core-test"* ]]; then
            echo "::warning::--skip-core-test found in the commit subject: the live provider jobs (test-core, test-core-integrations) will not run for this release. All other test jobs still gate it."
            echo "skip-core-test=true" >> $GITHUB_OUTPUT
          else
            echo "skip-core-test=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate admin permission for skip_tests
        id: skip_tests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_tests }}" == "true" ]]; then
            PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
            if [[ "$PERMISSION" != "admin" ]]; then
              echo "::error::Only repository admins can use skip_tests=true. ${{ github.actor }} has permission: $PERMISSION"
              exit 1
            fi
            echo "Admin verified: ${{ github.actor }} ($PERMISSION)"
            echo "skip-tests=true" >> $GITHUB_OUTPUT
          else
            echo "skip-tests=false" >> $GITHUB_OUTPUT
          fi

  # Detect what needs to be released
  detect-changes:
    needs: [check-skip]
    runs-on: ubuntu-latest
    # Skip if first line of commit message contains --skip-ci
    if: needs.check-skip.outputs.should-skip != 'true'
    outputs:
      core-needs-release: ${{ steps.detect.outputs.core-needs-release }}
      framework-needs-release: ${{ steps.detect.outputs.framework-needs-release }}
      plugins-need-release: ${{ steps.detect.outputs.plugins-need-release }}
      bifrost-http-needs-release: ${{ steps.detect.outputs.bifrost-http-needs-release }}
      docker-needs-release: ${{ steps.detect.outputs.docker-needs-release }}
      changed-plugins: ${{ steps.detect.outputs.changed-plugins }}
      core-version: ${{ steps.detect.outputs.core-version }}
      framework-version: ${{ steps.detect.outputs.framework-version }}
      transport-version: ${{ steps.detect.outputs.transport-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            _http._tcp.azure.archive.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            _https._tcp.dl.google.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            api.github.com:443
            azure.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            packages.microsoft.com:443
            proxy.golang.org:443
            registry.hub.docker.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Detect what needs release
        id: detect
        run: ./.github/workflows/scripts/detect-all-changes.sh "auto"

      - name: Validate Helm templates
        run: |
          chmod +x .github/workflows/scripts/validate-helm-templates.sh
          .github/workflows/scripts/validate-helm-templates.sh

      - name: Validate Helm config fields
        run: |
          chmod +x .github/workflows/scripts/validate-helm-config-fields.sh
          .github/workflows/scripts/validate-helm-config-fields.sh

      - name: Validate Go ↔ config.schema.json ↔ helm-chart sync (schemasync)
        run: |
          chmod +x .github/workflows/scripts/validate-schema-sync.sh
          .github/workflows/scripts/validate-schema-sync.sh

  # Builds the UI and the bifrost-http binary ONCE, and publishes the binary as
  # an artifact for every test job that just needs a runnable gateway.
  #
  # Before this job existed, nine jobs each built it themselves. Measured on a
  # cli-harness leg: `make build-ui` ~54s, `go build` on bifrost-http ~2m30s -
  # so ~3.5 minutes x 9 jobs, ~30 runner-minutes of duplicated work per run.
  # Consumers now download this artifact and pass SKIP_GATEWAY_BUILD=1, which
  # every build helper honours (harness-gateway.sh, test-api-integrations.sh,
  # cost-accuracy-test.sh, run-migration-tests.sh; load-test.sh already skips
  # when tmp/bifrost-http is present).
  #
  # test-core deliberately does NOT depend on this job. It is the pipeline's
  # longest job (~54m) and therefore its critical path, so making it wait for a
  # build it can do concurrently would push the whole run out by ~4 minutes.
  # It keeps its inline harness_build_gateway call.
  #
  # Gating is the union of the consumers' own conditions - if it were narrower,
  # a consumer could run with no artifact to download and fail at the download
  # step rather than falling back to building.
  full-tests:
    needs:
      - check-skip
      - detect-changes
    uses: ./.github/workflows/full-test-suite.yml
    with:
      core-needs-release: ${{ needs.detect-changes.outputs.core-needs-release }}
      framework-needs-release: ${{ needs.detect-changes.outputs.framework-needs-release }}
      plugins-need-release: ${{ needs.detect-changes.outputs.plugins-need-release }}
      bifrost-http-needs-release: ${{ needs.detect-changes.outputs.bifrost-http-needs-release }}
      docker-needs-release: ${{ needs.detect-changes.outputs.docker-needs-release }}
      should-skip: ${{ needs.check-skip.outputs.should-skip }}
      skip-tests: ${{ needs.check-skip.outputs.skip-tests }}
      skip-core-test: ${{ needs.check-skip.outputs.skip-core-test }}
    secrets: inherit

  core-release:
    needs: [check-skip, detect-changes, full-tests, publish-test-core-reports, approve-flaky-report-publication, publish-test-cli-harness-reports]
    if: "always() && needs.check-skip.outputs.should-skip != 'true' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.core-needs-release == 'true' && (needs.full-tests.outputs.test-core-result == 'success' || needs.full-tests.outputs.test-core-result == 'skipped' || (needs.full-tests.outputs.test-core-result == 'failure' && needs.full-tests.outputs.approve-flaky-test-core-result == 'success')) && (needs.full-tests.outputs.test-memory-result == 'success' || needs.full-tests.outputs.test-memory-result == 'skipped' || (needs.full-tests.outputs.test-memory-result == 'failure' && needs.full-tests.outputs.approve-memory-regression-result == 'success')) && (needs.full-tests.outputs.test-core-integrations-result == 'success' || needs.full-tests.outputs.test-core-integrations-result == 'skipped') && (needs.full-tests.outputs.test-core-unit-result == 'success' || needs.full-tests.outputs.test-core-unit-result == 'skipped') && (needs.full-tests.outputs.test-cli-harness-result == 'success' || needs.full-tests.outputs.test-cli-harness-result == 'skipped') && (needs.full-tests.outputs.test-vllm-result == 'success' || needs.full-tests.outputs.test-vllm-result == 'skipped') && (needs.full-tests.outputs.resolve-cli-versions-result == 'success' || needs.full-tests.outputs.resolve-cli-versions-result == 'skipped') && (needs.full-tests.outputs.test-framework-result == 'success' || needs.full-tests.outputs.test-framework-result == 'skipped') && (needs.full-tests.outputs.test-plugins-result == 'success' || needs.full-tests.outputs.test-plugins-result == 'skipped') && (needs.full-tests.outputs.test-bifrost-http-result == 'success' || needs.full-tests.outputs.test-bifrost-http-result == 'skipped') && (needs.full-tests.outputs.test-migrations-result == 'success' || needs.full-tests.outputs.test-migrations-result == 'skipped') && (needs.full-tests.outputs.test-api-integrations-result == 'success' || needs.full-tests.outputs.test-api-integrations-result == 'skipped') && (needs.full-tests.outputs.test-cost-accuracy-result == 'success' || needs.full-tests.outputs.test-cost-accuracy-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-amd64-result == 'success' || needs.full-tests.outputs.test-docker-image-amd64-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-arm64-result == 'success' || needs.full-tests.outputs.test-docker-image-arm64-result == 'skipped') && (needs.publish-test-core-reports.result == 'success' || needs.publish-test-core-reports.result == 'skipped' || (needs.publish-test-core-reports.result == 'failure' && (needs.full-tests.outputs.approve-flaky-test-core-result == 'success' || needs.approve-flaky-report-publication.result == 'success'))) && (needs.publish-test-cli-harness-reports.result == 'success' || needs.publish-test-cli-harness-reports.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      success: ${{ steps.release.outputs.success }}
      version: ${{ needs.detect-changes.outputs.core-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release core
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MAXIM_LOGGER_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ARN: ${{ secrets.AWS_ARN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
          VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_BEDROCK_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          REPLICATE_OWNER: ${{ secrets.REPLICATE_OWNER }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
        run: ./.github/workflows/scripts/release-core.sh "${{ needs.detect-changes.outputs.core-version }}"

  framework-release:
    needs: [check-skip, detect-changes, core-release, full-tests, publish-test-core-reports, approve-flaky-report-publication, publish-test-cli-harness-reports]
    if: "always() && needs.check-skip.outputs.should-skip != 'true' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.framework-needs-release == 'true' && (needs.full-tests.outputs.test-core-result == 'success' || needs.full-tests.outputs.test-core-result == 'skipped' || (needs.full-tests.outputs.test-core-result == 'failure' && needs.full-tests.outputs.approve-flaky-test-core-result == 'success')) && (needs.full-tests.outputs.test-core-integrations-result == 'success' || needs.full-tests.outputs.test-core-integrations-result == 'skipped') && (needs.full-tests.outputs.test-core-unit-result == 'success' || needs.full-tests.outputs.test-core-unit-result == 'skipped') && (needs.full-tests.outputs.test-cli-harness-result == 'success' || needs.full-tests.outputs.test-cli-harness-result == 'skipped') && (needs.full-tests.outputs.resolve-cli-versions-result == 'success' || needs.full-tests.outputs.resolve-cli-versions-result == 'skipped') && (needs.full-tests.outputs.test-framework-result == 'success' || needs.full-tests.outputs.test-framework-result == 'skipped') && (needs.full-tests.outputs.test-plugins-result == 'success' || needs.full-tests.outputs.test-plugins-result == 'skipped') && (needs.full-tests.outputs.test-bifrost-http-result == 'success' || needs.full-tests.outputs.test-bifrost-http-result == 'skipped') && (needs.full-tests.outputs.test-migrations-result == 'success' || needs.full-tests.outputs.test-migrations-result == 'skipped') && (needs.full-tests.outputs.test-api-integrations-result == 'success' || needs.full-tests.outputs.test-api-integrations-result == 'skipped') && (needs.full-tests.outputs.test-cost-accuracy-result == 'success' || needs.full-tests.outputs.test-cost-accuracy-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-amd64-result == 'success' || needs.full-tests.outputs.test-docker-image-amd64-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-arm64-result == 'success' || needs.full-tests.outputs.test-docker-image-arm64-result == 'skipped') && (needs.detect-changes.outputs.core-needs-release == 'false' || needs.core-release.result == 'success' || needs.core-release.result == 'skipped') && (needs.publish-test-core-reports.result == 'success' || needs.publish-test-core-reports.result == 'skipped' || (needs.publish-test-core-reports.result == 'failure' && (needs.full-tests.outputs.approve-flaky-test-core-result == 'success' || needs.approve-flaky-report-publication.result == 'success'))) && (needs.publish-test-cli-harness-reports.result == 'success' || needs.publish-test-cli-harness-reports.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      success: ${{ steps.release.outputs.success }}
      version: ${{ needs.detect-changes.outputs.framework-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Docker Compose
        run: |
          # Verify Docker is available
          docker --version
          # Install Docker Compose if not available as plugin
          if ! docker compose version >/dev/null 2>&1; then
            echo "Installing Docker Compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
          else
            echo "Docker Compose plugin is available"
            docker compose version
          fi

      - name: Release framework
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MAXIM_LOGGER_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ARN: ${{ secrets.AWS_ARN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
          VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          REPLICATE_OWNER: ${{ secrets.REPLICATE_OWNER }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
        run: ./.github/workflows/scripts/release-framework.sh "${{ needs.detect-changes.outputs.framework-version }}"

  plugins-release:
    needs: [check-skip, detect-changes, core-release, framework-release, full-tests, publish-test-core-reports, approve-flaky-report-publication, publish-test-cli-harness-reports]
