          allowed-endpoints: '127.0.0.1:8080 7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443 api.anthropic.com:443 api.cerebras.ai:443 api.cohere.ai:443 api.deepseek.com:443 api.elevenlabs.io:443 api.github.com:443 api.groq.com:443 api.mistral.ai:443 api.openai.com:443 api.parasail.io:443 api.tokenfactory.nebius.com:443 azure.archive.ubuntu.com:80 esm.ubuntu.com:443 bedrock-runtime.us-east-1.amazonaws.com:443 bedrock.us-east-1.amazonaws.com:443 bifrost-gateway-resource.openai.azure.com:443 fonts.googleapis.com:443 fonts.gstatic.com:443 generativelanguage.googleapis.com:443 getbifrost.ai:443 github.com:443 iojs.org:443 files.pythonhosted.org:443 openrouter.ai:443 pypi.org:443 models.dev:443 nodejs.org:443 o33249.ingest.sentry.io:443 proxy.golang.org:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 statsig.anthropic.com:443 storage.googleapis.com:443 sum.golang.org:443 www.getbifrost.ai:443

            '
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download CLI harness reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: cli-harness-reports-${{ matrix.label }}
          path: .
      - name: Publish CLI harness report
        if: ${{ !cancelled() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
