          ./.github/workflows/scripts/verify-bifrost-http-release.sh "${{ needs.detect-changes.outputs.transport-version }}" "${{ needs.detect-changes.outputs.bifrost-http-needs-release }}"
          echo "verified=true" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to Docker Hub
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          git pull origin ${{ github.ref_name }}
          VERSION="${{ needs.detect-changes.outputs.transport-version }}"
          BASE_TAG="${{ env.REGISTRY }}/${{ env.ACCOUNT }}/${{ env.IMAGE_NAME }}:v${VERSION}-ubi9-arm64"
          GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_TAG="ghcr.io/${GHCR_REPO}:v${VERSION}-ubi9-arm64"
          echo "tags=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "dockerhub-tag=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "ghcr-tag=${GHCR_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push UBI9 ARM64 Docker image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.redhat
          push: true
          build-args: |
            VERSION=${{ needs.detect-changes.outputs.transport-version }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/arm64
          cache-from: type=gha,scope=docker-ubi9-arm64
          cache-to: type=gha,mode=max,scope=docker-ubi9-arm64

      # Mirror the just-pushed Docker Hub image to GitHub Container Registry (ghcr.io)
      # by copying it with buildx imagetools (no rebuild). Best-effort: a ghcr.io
      # failure must not fail the Docker Hub release.
      - name: Mirror UBI9 ARM64 image to GitHub Container Registry
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.tags.outputs.ghcr-tag }}" \
            "${{ steps.tags.outputs.dockerhub-tag }}"

  # Docker UBI9 manifest — merges amd64 + arm64 into a single multi-arch tag
  docker-manifest-ubi9:
    needs: [check-skip, detect-changes, docker-build-ubi9-amd64, docker-build-ubi9-arm64]
    if: "always() && needs.check-skip.outputs.should-skip != 'true' && needs.docker-build-ubi9-amd64.result == 'success' && needs.docker-build-ubi9-arm64.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: docker.io
      ACCOUNT: maximhq
      IMAGE_NAME: bifrost
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to Docker Hub
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push UBI9 multi-arch manifest
        run: |
          ./.github/workflows/scripts/create-docker-manifest-ubi9.sh "${{ needs.detect-changes.outputs.transport-version }}"

  # Push Mintlify changelog
  push-mintlify-changelog:
    needs: [check-skip, detect-changes, core-release, framework-release, plugins-release, bifrost-http-release, full-tests, publish-test-core-reports, approve-flaky-report-publication, publish-test-cli-harness-reports]
    if: "always() && needs.check-skip.outputs.should-skip != 'true' && needs.detect-changes.result == 'success' && (needs.full-tests.outputs.test-core-result == 'success' || needs.full-tests.outputs.test-core-result == 'skipped' || (needs.full-tests.outputs.test-core-result == 'failure' && needs.full-tests.outputs.approve-flaky-test-core-result == 'success')) && (needs.full-tests.outputs.test-core-integrations-result == 'success' || needs.full-tests.outputs.test-core-integrations-result == 'skipped') && (needs.full-tests.outputs.test-core-unit-result == 'success' || needs.full-tests.outputs.test-core-unit-result == 'skipped') && (needs.full-tests.outputs.test-cli-harness-result == 'success' || needs.full-tests.outputs.test-cli-harness-result == 'skipped') && (needs.full-tests.outputs.resolve-cli-versions-result == 'success' || needs.full-tests.outputs.resolve-cli-versions-result == 'skipped') && (needs.full-tests.outputs.test-framework-result == 'success' || needs.full-tests.outputs.test-framework-result == 'skipped') && (needs.full-tests.outputs.test-plugins-result == 'success' || needs.full-tests.outputs.test-plugins-result == 'skipped') && (needs.full-tests.outputs.test-bifrost-http-result == 'success' || needs.full-tests.outputs.test-bifrost-http-result == 'skipped') && (needs.full-tests.outputs.test-migrations-result == 'success' || needs.full-tests.outputs.test-migrations-result == 'skipped') && (needs.full-tests.outputs.test-api-integrations-result == 'success' || needs.full-tests.outputs.test-api-integrations-result == 'skipped') && (needs.full-tests.outputs.test-cost-accuracy-result == 'success' || needs.full-tests.outputs.test-cost-accuracy-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-amd64-result == 'success' || needs.full-tests.outputs.test-docker-image-amd64-result == 'skipped') && (needs.full-tests.outputs.test-docker-image-arm64-result == 'success' || needs.full-tests.outputs.test-docker-image-arm64-result == 'skipped') && (needs.detect-changes.outputs.core-needs-release == 'false' || needs.core-release.result == 'success' || needs.core-release.result == 'skipped') && (needs.detect-changes.outputs.framework-needs-release == 'false' || needs.framework-release.result == 'success' || needs.framework-release.result == 'skipped') && (needs.detect-changes.outputs.plugins-need-release == 'false' || needs.plugins-release.result == 'success' || needs.plugins-release.result == 'skipped') && (needs.detect-changes.outputs.bifrost-http-needs-release == 'false' || needs.bifrost-http-release.result == 'success' || needs.bifrost-http-release.result == 'skipped') && (needs.publish-test-core-reports.result == 'success' || needs.publish-test-core-reports.result == 'skipped' || (needs.publish-test-core-reports.result == 'failure' && (needs.full-tests.outputs.approve-flaky-test-core-result == 'success' || needs.approve-flaky-report-publication.result == 'success'))) && (needs.publish-test-cli-harness-reports.result == 'success' || needs.publish-test-cli-harness-reports.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Push Mintlify changelog
        env:
          # Public origin serving the R2 bucket that test-core and
          # test-cli-harness publish their reports to. Unset means the changelog
          # simply omits the test-reports table - see the script for why it is
          # not hardcoded.
          TEST_REPORTS_BASE_URL: ${{ vars.TEST_REPORTS_BASE_URL }}
          # The CLI harness legs that actually ran. Normally latest/latest-1/
          # latest-2, but resolve-cli-versions degrades to a single "pinned" leg
          # when npm resolution fails - and the report objects are named after
          # whichever labels it emitted, so the changelog table has to follow
          # them rather than assume the three.
          # Guarded: this job's `if:` accepts resolve-cli-versions being skipped,
          # and a skipped job's output is the empty string - fromJSON('') is a
          # workflow-level error that fails the step before the script runs. An
          # empty value here is meaningful rather than missing: it tells the
          # script no CLI legs ran, so it emits no rows instead of defaulting to
          # the three standard labels and linking reports that do not exist.
          CLI_HARNESS_LABELS: ${{ needs.full-tests.outputs.cli-matrix && join(fromJSON(needs.full-tests.outputs.cli-matrix).*.label, ' ') || '' }}
        run: |
          ./.github/workflows/scripts/push-mintlify-changelog.sh "${{ needs.detect-changes.outputs.transport-version }}"

  # Notification
  notify:
    needs: [check-skip, detect-changes, core-release, framework-release, plugins-release, bifrost-http-release, docker-manifest, docker-manifest-ubi9, full-tests, publish-test-core-reports, approve-flaky-report-publication, publish-test-cli-harness-reports]
    if: "always() && needs.check-skip.outputs.should-skip != 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            _http._tcp.azure.archive.ubuntu.com:443
            _https._tcp.dl.google.com:443
            motd.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            azure.archive.ubuntu.com:80
            discord.com:443
            discordapp.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            packages.microsoft.com:443

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Build status summary
          CORE_STATUS="⏭️ Skipped"
          FRAMEWORK_STATUS="⏭️ Skipped"
          PLUGINS_STATUS="⏭️ Skipped"
          BIFROST_STATUS="⏭️ Skipped"

          if [ "${{ needs.core-release.result }}" = "success" ]; then
            CORE_STATUS="✅ Released v${{ needs.detect-changes.outputs.core-version }}"
          elif [ "${{ needs.core-release.result }}" = "failure" ]; then
            CORE_STATUS="❌ Failed"
          fi

          if [ "${{ needs.framework-release.result }}" = "success" ]; then
            FRAMEWORK_STATUS="✅ Released v${{ needs.detect-changes.outputs.framework-version }}"
          elif [ "${{ needs.framework-release.result }}" = "failure" ]; then
            FRAMEWORK_STATUS="❌ Failed"
          fi

          if [ "${{ needs.plugins-release.result }}" = "success" ]; then
            PLUGINS_STATUS="✅ Released plugins"
          elif [ "${{ needs.plugins-release.result }}" = "failure" ]; then
            PLUGINS_STATUS="❌ Failed"
          fi

          if [ "${{ needs.bifrost-http-release.result }}" = "success" ]; then
            BIFROST_STATUS="✅ Released v${{ needs.detect-changes.outputs.transport-version }}"
          elif [ "${{ needs.bifrost-http-release.result }}" = "failure" ]; then
            BIFROST_STATUS="❌ Failed"
          fi

          # Build the message with proper formatting
          MESSAGE=$(printf "🚀 **Release Pipeline Complete**\n\n**Components:**\n• Core: %s\n• Framework: %s\n• Plugins: %s\n• Bifrost HTTP: %s\n\n**Details:**\n• Branch: \`${{ github.ref_name }}\`\n• Commit: \`%.8s\`\n• Author: %s\n\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" "$CORE_STATUS" "$FRAMEWORK_STATUS" "$PLUGINS_STATUS" "$BIFROST_STATUS" "${{ github.sha }}" "${{ github.actor }}")

          payload="$(jq -n --arg content "$MESSAGE" '{content:$content}')"
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

  publish-test-core-reports:
