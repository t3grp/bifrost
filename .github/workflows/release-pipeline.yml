  # R2 used to run inside test-core; keep its original protected failure override.
  approve-flaky-report-publication:
    needs: [full-tests, publish-test-core-reports]
    if: always() && needs.full-tests.outputs.test-core-result == 'success' && needs.full-tests.outputs.approve-flaky-test-core-result != 'success' && needs.publish-test-core-reports.result == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: flaky-test-override
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Approve failed provider report publication
        run: echo "::warning::Provider tests passed, but R2 report publication failed. The existing flaky-test-override approval permits this production release without a published report."
