    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: block
          allowed-endpoints: '127.0.0.1:8080 7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443 accounts.google.com:443 aiplatform.googleapis.com:443 api.anthropic.com:443 api.cerebras.ai:443 api.cohere.ai:443 api.deepseek.com:443 api.elevenlabs.io:443 api.fireworks.ai:443 api.github.com:443 api.githubcopilot.com:443 api.business.githubcopilot.com:443 api.enterprise.githubcopilot.com:443 api.individual.githubcopilot.com:443 api.groq.com:443 api.mistral.ai:443 api.openai.com:443 api.parasail.io:443 api.perplexity.ai:443 api.replicate.com:443 api.tokenfactory.nebius.com:443 api.x.ai:443 azure.archive.ubuntu.com:80 esm.ubuntu.com:443 bifrost-gateway-resource.openai.azure.com:443 bedrock-mantle.us-east-1.api.aws:443 bedrock-runtime.us-east-1.amazonaws.com:443 bedrock.us-east-1.amazonaws.com:443 bifrost-batch-api-file-upload-testing.s3.us-east-1.amazonaws.com:443 discoveryengine.googleapis.com:443 dl.google.com:443 fal.media:443 fonts.googleapis.com:443 fonts.gstatic.com:443 generativelanguage.googleapis.com:443 files.pythonhosted.org:443 pypi.org:443 getbifrost.ai:443 github.com:443 huggingface.co:443 iojs.org:443 login.microsoftonline.com:443 maxim-o1.openai.azure.com:443 nodejs.org:443 oauth2.googleapis.com:443 objects.githubusercontent.com:443 openrouter.ai:443 packages.cloud.google.com:443 proxy.golang.org:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 router.huggingface.co:443 storage.googleapis.com:443 sum.golang.org:443 us-central1-aiplatform.googleapis.com:443 www.berkshirehathaway.com:443 www.getbifrost.ai:443

            '
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
